# ---------------------------------------------------------------------------
# Reverse proxy (Traefik) + homepage.
#
#   http(s)://<proxy_domain>/             homepage linking to everything
#   http(s)://<proxy_domain>/radarr       ... one folder per service
#   http(s)://requests.<proxy_domain>     Seerr (can't run in a folder)
#
# Point a DNS record for proxy_domain AND *.proxy_domain (or at least
# requests.proxy_domain) at the container's IP.
#
# DON'T EDIT THIS FILE for your setup: these are the committed defaults.
# Override any of them in proxy.yml next to it (git-ignored, loaded after this
# file because Ansible reads group_vars files in alphabetical order).
# Start from proxy.yml.example.
# ---------------------------------------------------------------------------

proxy_domain: fakeflix.lan

# false = plain HTTP (fine on a LAN).
# true  = HTTPS with Let's Encrypt certificates, HTTP redirects to HTTPS.
proxy_https: false
proxy_acme_email: ""

# dns:  (recommended) Let's Encrypt checks a TXT record your DNS provider's API
#       creates. Works on a LAN-only box and gets ONE wildcard certificate for
#       proxy_domain + *.proxy_domain, so new subdomains need nothing.
# http: port 80 of every (sub)domain must be reachable from the internet;
#       one certificate per subdomain.
proxy_acme_challenge: dns
# Provider code from https://doc.traefik.io/traefik/https/acme/#providers
proxy_acme_dns_provider: ""          # e.g. cloudflare
# The provider's credentials (env vars named on that page) go in
# group_vars/all/secrets.yml, which is git-ignored - see secrets.yml.example:
#   proxy_acme_env:
#     CF_DNS_API_TOKEN: "..."
# Public resolvers used to check the TXT record went live. Don't use your
# LAN DNS here if it overrides proxy_domain locally.
proxy_acme_dns_resolvers: ["1.1.1.1:53", "9.9.9.9:53"]
# true = Let's Encrypt *staging* (untrusted certs, no rate limits) for a first
# test. Switching back to false: delete appdata/traefik/acme.json, re-deploy.
proxy_acme_staging: false

# Optional HTTP basic auth in front of everything (htpasswd lines, generate
# with `htpasswd -nbB user password`). Empty = no extra login.
proxy_basic_auth_users: []

proxy_scheme: "{{ 'https' if proxy_https | bool else 'http' }}"

# --- Homepage -----------------------------------------------------------------
homepage_title: Fakeflix

# --- Services running elsewhere (other VMs/LXCs/boxes) ------------------------
# Each entry gets a homepage tile. Give it a `path` or `subdomain` and Traefik
# also serves it under proxy_domain; without one it's just a link.
#
#   url           where it really runs (http or https)
#   path          folder on proxy_domain, e.g. /jellyfin
#   subdomain     or <subdomain>.<proxy_domain> instead (safest for apps
#                 that don't support a base URL)
#   strip_prefix  true if the app can't be told its base path (see README)
#   insecure      true for self-signed HTTPS backends (e.g. Proxmox)
#   homepage      {name, group, description, icon, widget: {type, key, ...}}
#                 (widget url defaults to `url`; widget types/fields:
#                  https://gethomepage.dev/widgets/)
external_services: {}
#  jellyfin:
#    url: http://192.168.1.20:8096
#    subdomain: jellyfin                 # -> http://jellyfin.fakeflix.meme.ar
#    homepage:
#      name: Jellyfin
#      group: Watch
#      description: Movies & shows
#      widget: { type: jellyfin, key: "<Dashboard -> API Keys>", enableBlocks: true }
#  proxmox:
#    url: https://192.168.1.10:8006
#    subdomain: proxmox
#    insecure: true
#    homepage: { name: Proxmox, group: Infra }
#  router:
#    url: http://192.168.1.1              # no path/subdomain = link only
#    homepage: { name: Router, group: Infra, icon: router.png }
