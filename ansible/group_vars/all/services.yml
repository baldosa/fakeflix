# ---------------------------------------------------------------------------
# Service catalog. Every entry becomes a service in the generated compose file.
#
# Keys per service:
#   enabled      bool, default true
#   image        image name without tag
#   tag          image tag, default "latest"
#   linuxserver  bool, inject PUID/PGID/TZ/UMASK (linuxserver.io images)
#   appdata      bool, default true: create {{ appdata_dir }}/<name> and mount it at `config_path`
#   config_path  container path for the appdata dir, default /config
#   media        bool, mount every entry of media_mounts (see main.yml)
#   ports        list of "host:container[/proto]"
#   environment  dict of extra env vars
#   volumes      list of extra volumes
#   extra        dict merged verbatim into the compose service (depends_on, devices, user, ...)
#   templates    files rendered into the appdata dir before start, restarting the
#                service when they change: [{src: <ansible/templates/...>, dest: <file>}]
#   web          how the reverse proxy serves it (omit = not proxied):
#                  path          folder on proxy_domain, e.g. /radarr ("/" = the root)
#                  subdomain     serve at <subdomain>.<proxy_domain> instead of a folder
#                  base_env      env var that tells the app its base path
#                  strip_prefix  true for apps that can't be told their base path
#                  port          container port, if the service publishes none
#                  homepage      tile: {name, group, description, icon, widget: <homepage widget type>}
#
# Don't edit this file to customise: use the two dicts below (or host_vars).
# ---------------------------------------------------------------------------

stack_default_services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent
    linuxserver: true
    media: true
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    environment:
      WEBUI_PORT: "8080"
      TORRENTING_PORT: "6881"
    web:
      path: /qbittorrent
      strip_prefix: true
      homepage: { name: qBittorrent, group: Downloads, description: Torrents, widget: qbittorrent }

  prowlarr:
    image: lscr.io/linuxserver/prowlarr
    linuxserver: true
    ports:
      - "9696:9696"
    environment:
      PROWLARR__AUTH__APIKEY: "{{ api_keys.prowlarr }}"
      PROWLARR__AUTH__METHOD: "{{ arr_auth_method }}"
      PROWLARR__AUTH__REQUIRED: DisabledForLocalAddresses
    web:
      path: /prowlarr
      base_env: PROWLARR__SERVER__URLBASE
      homepage: { group: Downloads, description: Indexers, widget: prowlarr }

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr
    appdata: false
    ports:
      - "8191:8191"
    environment:
      LOG_LEVEL: info
      TZ: "{{ timezone }}"

  radarr:
    image: lscr.io/linuxserver/radarr
    linuxserver: true
    media: true
    ports:
      - "7878:7878"
    environment:
      RADARR__AUTH__APIKEY: "{{ api_keys.radarr }}"
      RADARR__AUTH__METHOD: "{{ arr_auth_method }}"
      RADARR__AUTH__REQUIRED: DisabledForLocalAddresses
    web:
      path: /radarr
      base_env: RADARR__SERVER__URLBASE
      homepage: { group: Library, description: Movies, widget: radarr }

  sonarr:
    image: lscr.io/linuxserver/sonarr
    linuxserver: true
    media: true
    ports:
      - "8989:8989"
    environment:
      SONARR__AUTH__APIKEY: "{{ api_keys.sonarr }}"
      SONARR__AUTH__METHOD: "{{ arr_auth_method }}"
      SONARR__AUTH__REQUIRED: DisabledForLocalAddresses
    web:
      path: /sonarr
      base_env: SONARR__SERVER__URLBASE
      homepage: { group: Library, description: Series, widget: sonarr }

  bazarr:
    image: lscr.io/linuxserver/bazarr
    linuxserver: true
    media: true
    ports:
      - "6767:6767"
    web:
      path: /bazarr      # base path is set in Bazarr's config by the configure role
      homepage: { group: Library, description: Subtitles, widget: bazarr }

  seerr:
    image: ghcr.io/seerr-team/seerr
    config_path: /app/config
    ports:
      - "5055:5055"
    environment:
      TZ: "{{ timezone }}"
      LOG_LEVEL: info
    extra:
      user: "{{ puid }}:{{ pgid }}"
      init: true
    web:
      subdomain: requests   # Seerr has no base-path support, so no folder
      homepage: { group: Watch, description: Request movies & series, widget: jellyseerr }

  traefik:
    image: traefik
    tag: v3
    config_path: /etc/traefik
    ports:
      - "80:80"
      - "443:443"
    environment: "{{ proxy_acme_env | default({}) }}"
    templates:
      - { src: traefik/traefik.yml.j2, dest: traefik.yml }
      - { src: traefik/dynamic.yml.j2, dest: dynamic.yml }

  homepage:
    image: ghcr.io/gethomepage/homepage
    config_path: /app/config
    environment:
      PUID: "{{ puid }}"
      PGID: "{{ pgid }}"
      HOMEPAGE_ALLOWED_HOSTS: "{{ proxy_domain }}"
    web:
      path: /
      port: 3000
    templates:
      - { src: homepage/settings.yaml.j2, dest: settings.yaml }
      - { src: homepage/services.yaml.j2, dest: services.yaml }
      - { src: homepage/widgets.yaml.j2, dest: widgets.yaml }
      - { src: homepage/bookmarks.yaml.j2, dest: bookmarks.yaml }


# Add brand-new services here (same schema as above).
stack_extra_services: {}
#  jellyfin:
#    image: lscr.io/linuxserver/jellyfin
#    linuxserver: true
#    media: true
#    ports: ["8096:8096"]

# Tweak existing services without copying them (deep-merged).
stack_service_overrides: {}
#  radarr:
#    tag: "5.14.0"
#  bazarr:
#    enabled: false

stack_services: "{{ stack_default_services | combine(stack_extra_services, stack_service_overrides, recursive=True) }}"
