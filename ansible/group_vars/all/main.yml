# ---------------------------------------------------------------------------
# Global settings. Override per host in host_vars/<host>.yml if needed.
# ---------------------------------------------------------------------------

timezone: Etc/UTC

# User/group the containers run as and that owns config + media files.
puid: 1000
pgid: 1000
umask: "002"

# Media folders on the Docker host (absolute paths, created if missing).
# Put them wherever you like - different names, different disks, extra folders.
media_dirs:
  downloads: /mnt/disk/Downloads
  movies: /mnt/disk/movies
  series: /mnt/disk/series
  music: /mnt/disk/music

# How media reaches the apps: host_path: container_path, mounted into every
# service with `media: true`. Every folder in media_dirs must live under one
# of these.
#
# Default: the common parent mounted once at /data, so the apps see
# /data/Downloads, /data/movies, ... Downloads and library on the same mount =
# hardlinks / instant moves. If your folders are on different disks, add one
# entry per disk, e.g.
#   media_mounts:
#     /mnt/disk: /data
#     /mnt/disk2/movies: /data/movies
media_mounts:
  /mnt/disk: /data

# Service configuration/databases live here (one sub-directory per service).
appdata_dir: /opt/fakeflix/appdata

# Compose project location and name.
stack_dir: /opt/fakeflix
stack_name: fakeflix

# Env injected into every service flagged `linuxserver: true`.
linuxserver_env:
  PUID: "{{ puid }}"
  PGID: "{{ pgid }}"
  TZ: "{{ timezone }}"
  UMASK: "{{ umask }}"
