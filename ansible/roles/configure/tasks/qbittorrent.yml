# qBittorrent rewrites its config on shutdown, so it is edited while stopped.
- name: qBittorrent | wait for config file
  ansible.builtin.stat:
    path: "{{ appdata_dir }}/qbittorrent/qBittorrent/qBittorrent.conf"
  register: configure_qbit_conf
  until: configure_qbit_conf.stat.exists
  retries: "{{ configure_wait_retries }}"
  delay: 5

- name: qBittorrent | desired settings
  ansible.builtin.set_fact:
    configure_qbit_settings:
      - { section: Preferences, option: 'WebUI\LocalHostAuth', value: "false" }
      - { section: Preferences, option: 'WebUI\AuthSubnetWhitelistEnabled', value: "true" }
      - { section: Preferences, option: 'WebUI\AuthSubnetWhitelist', value: "{{ qbittorrent_auth_bypass_subnets | join(', ') }}" }
      - { section: Preferences, option: 'WebUI\HostHeaderValidation', value: "false" }
      # Behind Traefik: trust its X-Forwarded-For so the login bypass applies to
      # the real client address, not the proxy's.
      - { section: Preferences, option: 'WebUI\ReverseProxySupportEnabled', value: "true" }
      - { section: Preferences, option: 'WebUI\TrustedReverseProxiesList', value: "172.16.0.0/12" }
      - { section: BitTorrent, option: 'Session\DefaultSavePath', value: "{{ configure_paths.downloads }}" }
      - { section: BitTorrent, option: 'Session\TempPathEnabled', value: "false" }

- name: qBittorrent | check settings
  community.general.ini_file:
    path: "{{ configure_qbit_conf.stat.path }}"
    section: "{{ item.section }}"
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    no_extra_spaces: true
    mode: "0644"
  loop: "{{ configure_qbit_settings }}"
  check_mode: true
  register: configure_qbit_check

# Not a handler: the stop/edit/start must happen right here, in order.
- name: qBittorrent | apply settings  # noqa: no-handler
  when: configure_qbit_check is changed
  block:
    - name: qBittorrent | stop
      community.docker.docker_container:
        name: qbittorrent
        state: stopped

    - name: qBittorrent | write settings
      community.general.ini_file:
        path: "{{ configure_qbit_conf.stat.path }}"
        section: "{{ item.section }}"
        option: "{{ item.option }}"
        value: "{{ item.value }}"
        no_extra_spaces: true
        owner: "{{ puid }}"
        group: "{{ pgid }}"
        mode: "0644"
      loop: "{{ configure_qbit_settings }}"

    - name: qBittorrent | start
      community.docker.docker_compose_v2:
        project_src: "{{ stack_dir }}"
        project_name: "{{ stack_name }}"
        services: [qbittorrent]
        state: present

- name: qBittorrent | wait for API (no login)
  ansible.builtin.include_tasks: wait_api.yml
  vars:
    wait_label: qBittorrent
    wait_url: "{{ configure_local.qbittorrent }}/api/v2/app/version"
